<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · Voyagio</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>

<body>
    <div class="loader" id="loader">
        <div class="loader__spinner"></div>
    </div>
    <div data-partial="header" data-level="1"></div>

    <div class="auth">
        
        <div class="auth__form-wrap">
            <form class="form" data-form="login" id="loginForm" name="loginForm" style="max-width:460px;margin:0 auto;">
                <h1 class="form__title">Login</h1>
                <p class="form__subtitle">Enter your credentials to continue.</p>
                <div class="form__group"><label class="form__label" for="loginEmail">Email</label><input
                        class="form__control" id="loginEmail" name="email" type="email" required
                        placeholder="you@voyagio.travel" /></div>
                <div class="form__group"><label class="form__label" for="loginPassword">Password</label><input
                        class="form__control" id="loginPassword" name="password" type="password" required
                        placeholder="••••••••" /></div>
                <div class="form__group"
                    style="display:flex;justify-content:space-between;align-items:center;font-size:0.85rem;">
                    <label style="display:flex;align-items:center;gap:0.4rem;"><input type="checkbox" /> Remember
                        me</label>
                    <a href="#" style="color:var(--color-primary);font-weight:600;">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn--primary btn--block btn--lg">Sign In</button>
                <p class="form__meta">New here? <a href="register.html">Create an account</a></p>
            </form>
        </div>
    </div>

    <div data-partial="footer" data-level="1"></div>
    <script src="../assets/js/partials.js"></script>
    <script src="../assets/js/main.js"></script>
</body>

</html>
